<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar Claude</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f2ec;color:#1b1b1b;margin:0;padding:24px 16px}main{max-width:520px;margin:6vh auto;background:#fff;border:1px solid #d9d2c4;border-radius:12px;padding:24px}h1{font-size:22px;margin:0 0 4px}ol{padding-left:20px}button,.b{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;background:#1b1b1b;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}textarea{font:12px/1.4 ui-monospace,monospace;width:100%;box-sizing:border-box;padding:9px;border:1px solid #d9d2c4;border-radius:8px;margin-top:10px;resize:vertical;word-break:break-all}input{font:inherit;width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9d2c4;border-radius:8px;margin:8px 0}#m{min-height:24px;margin-top:12px}.ok{color:#1d6b3a}.er{color:#a33a2a}[hidden]{display:none}</style></head>
<body><main><h1>Conectar Claude</h1><p id="s">Verificando…</p>
<ol><li><button id="g">Gerar link</button> <a class="b" id="l" target="_blank" rel="noopener noreferrer" hidden>Abrir e autorizar</a> <button type="button" id="k" hidden>Copiar link</button><textarea id="u" readonly rows="3" hidden aria-label="Link de login"></textarea></li><li style="margin-top:14px">Autorize com a conta do Board e copie o código.</li><li style="margin-top:8px">Cole aqui:<form id="f"><input id="c" type="password" autocomplete="off" placeholder="Código" disabled><button id="e" disabled>Conectar</button></form></li></ol><div id="m" role="status"></div><p><a href="/">Voltar ao Board</a></p></main>
<script>
const $=i=>document.getElementById(i),msg=(t,k)=>{$('m').textContent=t;$('m').className=k||''};
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error==='login'?'Entre no Board de novo':j.error);return j}
async function st(){try{const r=await api('/api/claude/vps-status');$('s').textContent=r.loggedIn?'O Claude está conectado.':r.loggedIn===false?'O Claude está desconectado.':'Não consegui verificar.'}catch(e){$('s').textContent=e.message}}
$('g').onclick=async()=>{$('g').disabled=true;msg('Gerando…');try{const r=await api('/api/claude/vps-start',{});if(!/^https:\/\/claude\.com\//.test(r.url))throw Error('link inesperado');$('l').href=r.url;$('l').hidden=$('k').hidden=$('u').hidden=false;$('u').value=r.url;$('k').textContent='Copiar link';$('c').disabled=$('e').disabled=false;msg('Link pronto, vale 10 minutos.')}catch(e){msg(e.message,'er')}$('g').disabled=false;$('g').textContent='Gerar outro link'};
$('k').onclick=async()=>{const u=$('u');let ok=false;try{await navigator.clipboard.writeText(u.value);ok=true}catch{u.focus();u.select();try{ok=document.execCommand('copy')}catch{}}$('k').textContent=ok?'Copiado':'Selecione e copie';setTimeout(()=>$('k').textContent='Copiar link',2500)};
$('f').onsubmit=async v=>{v.preventDefault();const code=$('c').value.trim();if(!code)return;$('c').value='';$('e').disabled=true;msg('Conectando…');try{await api('/api/claude/vps-code',{code});msg('Claude conectado. Pode voltar ao Board.','ok')}catch(e){msg(e.message,'er')}st()};st();
</script></body></html>
